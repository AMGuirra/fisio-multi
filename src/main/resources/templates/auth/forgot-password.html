<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 55%,#0d9488 180%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .card{width:min(460px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 30px 60px rgba(15,23,42,.28)}
        .title{margin:0 0 8px;font-size:1.7rem;color:#0f172a}
        .subtitle{margin:0 0 24px;color:#64748b;line-height:1.5}
        .field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
        .field input{border:1px solid #d8e4e1;border-radius:14px;padding:14px 15px;font-size:.95rem}
        .field input:focus{outline:none;border-color:#0f8f7a;box-shadow:0 0 0 3px rgba(15,143,122,.12)}
        .btn{width:100%;border:0;border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,#0f8f7a,#0c7a68);color:#fff;font-weight:700;cursor:pointer}
        .flash{padding:12px 14px;border-radius:14px;margin-bottom:16px;font-size:.92rem}
        .flash.success{background:#dcf7ea;color:#127247}
        .flash.error{background:#ffe7e7;color:#8a3d3d}
        .back{display:inline-flex;align-items:center;gap:8px;margin-top:18px;color:#0f8f7a;text-decoration:none;font-weight:600}
    </style>
</head>
<body>
<div class="card">
    <h1 class="title">Recuperar senha</h1>
    <p class="subtitle">Informe o e-mail cadastrado. Se ele existir no sistema, enviaremos um link seguro para redefinir sua senha.</p>

    <div th:if="${successMessage}" class="flash success" th:text="${successMessage}">Sucesso</div>
    <div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}">Erro</div>

    <form th:action="@{/esqueci-minha-senha}" th:object="${forgotPasswordForm}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field">
            <label for="email">E-mail</label>
            <input id="email" type="email" th:field="*{email}" placeholder="usuario@clinica.com" required>
            <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:#b24747"></small>
        </div>
        <button class="btn" type="submit">Enviar instruções</button>
    </form>

    <a class="back" th:href="@{/login}">Voltar para o login</a>
</div>
</body>
</html>
