<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="auth-body">
<div class="auth-card">
    <div class="auth-brand">
        <div class="auth-brand-icon"><i data-lucide="key-round"></i></div>
        <h1 class="auth-brand-title">Recuperar senha</h1>
        <p class="auth-brand-subtitle">Informe o e-mail cadastrado. Se ele existir no sistema, enviaremos um link seguro para redefinir sua senha.</p>
    </div>

    <div th:if="${successMessage}" class="auth-alert success" th:text="${successMessage}">Sucesso</div>
    <div th:if="${errorMessage}" class="auth-alert error" th:text="${errorMessage}">Erro</div>

    <form th:action="@{/esqueci-minha-senha}" th:object="${forgotPasswordForm}" method="post">
        <div class="auth-field">
            <label for="email">E-mail</label>
            <input id="email" type="email" th:field="*{email}" placeholder="usuario@clinica.com" required>
            <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
        </div>
        <button class="auth-btn" type="submit">Enviar instruções</button>
    </form>

    <div class="auth-back">
        <a class="auth-back-link" th:href="@{/login}">
            <i data-lucide="arrow-left"></i>
            Voltar para o login
        </a>
    </div>
</div>
</body>
</html>
