<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:with="csrfParameterName=${_csrf.parameterName}, csrfToken=${_csrf.token}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="auth-body" th:attr="data-theme=${loggedUserTheme.cssValue}" th:classappend="${loggedUserTheme.name() == 'DARK' ? ' theme-dark' : ''}">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-brand-icon">
                <i data-lucide="heart-pulse"></i>
            </div>
            <h1 class="auth-brand-title">FisioGestao</h1>
            <p class="auth-brand-subtitle">Sistema de Gestão para Clínicas de Fisioterapia</p>
        </div>

        <div th:if="${param.error}" class="auth-alert danger">
            <i data-lucide="triangle-alert"></i>
            Usuário ou senha inválidos
        </div>

        <div th:if="${param.bloqueado}" class="auth-alert danger">
            <i data-lucide="shield-ban"></i>
            Muitas tentativas de login. Aguarde 15 minutos antes de tentar novamente.
        </div>

        <div th:if="${param.expirado}" class="auth-alert danger">
            <i data-lucide="clock"></i>
            Sua sessão expirou porque outro acesso foi iniciado. Faça login novamente.
        </div>

        <div th:if="${param.logout}" class="auth-alert success">
            <i data-lucide="circle-check"></i>
            Você foi desconectado com sucesso
        </div>
        <div th:if="${successMessage}" class="auth-alert success">
            <i data-lucide="circle-check"></i>
            <span th:text="${successMessage}">Sucesso</span>
        </div>

        <form action="/login" method="post">
            <input type="hidden" th:name="${csrfParameterName}" th:value="${csrfToken}">

            <div class="auth-field">
                <label for="username">
                    <i data-lucide="user-round"></i>
                    Usuário
                </label>
                <input type="text" id="username" name="username"
                       placeholder="admin ou seu@email.com" autocomplete="username" required autofocus>
            </div>

            <div class="auth-field">
                <label for="password">
                    <i data-lucide="lock"></i>
                    Senha
                </label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="auth-btn">
                <i data-lucide="log-in"></i>
                Entrar
            </button>
        </form>

        <div class="auth-back">
            <a th:href="@{/esqueci-minha-senha}">
                <i data-lucide="circle-help"></i>
                Esqueci minha senha
            </a>
        </div>
    </div>
    <script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
    <script>
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
