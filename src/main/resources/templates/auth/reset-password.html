<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - FisioGestao</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background:#eff6f4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .card{width:min(520px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 26px 52px rgba(15,23,42,.12)}
        .title{margin:0 0 8px;font-size:1.7rem;color:#0f172a}
        .subtitle{margin:0 0 24px;color:#64748b;line-height:1.5}
        .field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
        .field input{border:1px solid #d8e4e1;border-radius:14px;padding:14px 15px;font-size:.95rem}
        .field input:focus{outline:none;border-color:#0f8f7a;box-shadow:0 0 0 3px rgba(15,143,122,.12)}
        .btn{width:100%;border:0;border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,#0f8f7a,#0c7a68);color:#fff;font-weight:700;cursor:pointer}
        .flash{padding:12px 14px;border-radius:14px;margin-bottom:16px;font-size:.92rem}
        .flash.error{background:#ffe7e7;color:#8a3d3d}
        .flash.warning{background:#fff4d8;color:#8a6400}
    </style>
</head>
<body>
<div class="card">
    <h1 class="title">Definir nova senha</h1>
    <p class="subtitle">Use o link recebido por e-mail para criar uma nova senha de acesso.</p>

    <div th:if="${errorMessage}" class="flash error" th:text="${errorMessage}">Erro</div>
    <div th:if="${tokenValido == false}" class="flash warning">Este link é inválido, já foi utilizado ou expirou. Solicite um novo e-mail de redefinição.</div>

    <form th:if="${tokenValido}" th:action="@{/resetar-senha}" th:object="${resetPasswordForm}" method="post">
        <input type="hidden" th:field="*{token}">
        <div class="field">
            <label for="password">Nova senha</label>
            <input id="password" type="password" th:field="*{password}" required>
            <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:#b24747"></small>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirmar senha</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" required>
            <small th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color:#b24747"></small>
        </div>
        <button class="btn" type="submit">Salvar nova senha</button>
    </form>
</div>
</body>
</html>
