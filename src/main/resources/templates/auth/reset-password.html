<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="auth-body">
<div class="auth-card">
    <div class="auth-brand">
        <div class="auth-brand-icon"><i data-lucide="lock-keyhole"></i></div>
        <h1 class="auth-brand-title">Definir nova senha</h1>
        <p class="auth-brand-subtitle">Use o link recebido por e-mail para criar uma nova senha de acesso.</p>
    </div>

    <div th:if="${errorMessage}" class="auth-alert danger" th:text="${errorMessage}">Erro</div>
    <div th:if="${tokenValido == false}" class="auth-alert danger">
        <i data-lucide="shield-x"></i>
        Este link é inválido, já foi utilizado ou expirou. Solicite um novo e-mail de redefinição.
    </div>

    <form th:if="${tokenValido}" th:action="@{/resetar-senha}" th:object="${resetPasswordForm}" method="post">
        <input type="hidden" th:field="*{token}">
        <div class="auth-field">
            <label for="password">Nova senha</label>
            <input id="password" type="password" th:field="*{password}" required>
            <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
        </div>
        <div class="auth-field">
            <label for="confirmPassword">Confirmar senha</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" required>
            <small class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
        </div>
        <button class="auth-btn" type="submit">
            <i data-lucide="check"></i>
            Salvar nova senha
        </button>
    </form>

    <div class="auth-back">
        <a class="auth-back-link" th:href="@{/login}">
            <i data-lucide="arrow-left"></i>
            Voltar para o login
        </a>
    </div>
</div>
<script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
<script>
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
    }
</script>
</body>
</html>
