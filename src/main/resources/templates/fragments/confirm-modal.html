<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="confirmActionModal">
    <div id="confirmActionModal" class="app-modal" aria-hidden="true">
        <div class="app-modal-backdrop" data-modal-close></div>
        <div class="app-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmActionModalTitle" aria-describedby="confirmActionModalMessage">
            <div class="app-modal-card">
                <header class="app-modal-header">
                    <div class="app-modal-title-block">
                        <h3 id="confirmActionModalTitle">Confirmar ação</h3>
                        <p id="confirmActionModalMessage">Revise esta ação antes de continuar.</p>
                    </div>
                    <button type="button" class="app-modal-close" data-modal-close aria-label="Fechar modal">
                        <i data-lucide="x"></i>
                    </button>
                </header>
                <div class="app-modal-body">
                    <div class="helper-card modal-helper-card">
                        <div class="helper-copy">
                            <h4 id="confirmActionModalHelperTitle">Essa ação exige confirmação</h4>
                            <p id="confirmActionModalHelperMessage">Os dados serão enviados assim que você confirmar.</p>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="action-button ghost" data-modal-close>Voltar</button>
                        <button type="button" class="action-button danger" id="confirmActionModalSubmit">
                            <i data-lucide="triangle-alert"></i>
                            <span id="confirmActionModalSubmitLabel">Confirmar</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
