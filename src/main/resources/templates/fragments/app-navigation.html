<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="sidebar">
        <script th:inline="javascript" th:attr="nonce=${cspNonce}">
            (() => {
                const preferredTheme = /*[[${loggedUserTheme.cssValue}]]*/ 'light';
                document.documentElement.style.colorScheme = preferredTheme === 'dark' ? 'dark' : 'light';
                document.documentElement.dataset.theme = preferredTheme;
                if (document.body) {
                    document.body.dataset.theme = preferredTheme;
                    document.body.classList.toggle('theme-dark', preferredTheme === 'dark');
                }
            })();
        </script>
        <!-- Sistema global de notificações toast -->
        <script th:src="@{/js/toast.js}" defer></script>
        <script th:src="@{/js/responsive-tables.js}" defer></script>
        <script th:src="@{/js/action-menu.js}" defer></script>
        <script th:src="@{/js/whatsapp.js}" defer></script>

        <aside class="app-sidebar" id="appSidebar" role="navigation" aria-label="Menu lateral principal" aria-hidden="false">
            <div class="sidebar-header">
                <a th:href="@{/dashboard}" href="/dashboard" class="sidebar-brand">
                    <span class="sidebar-brand-mark"><i data-lucide="heart-pulse"></i></span>
                    <span class="sidebar-brand-copy">
                        <span class="sidebar-brand-title">FisioGestao</span>
                        <span class="sidebar-brand-subtitle">Painel Clínico</span>
                    </span>
                </a>
            </div>

            <ul class="sidebar-nav">
                <th:block th:each="item : ${sidebarNavItems}">
                    <li th:class="${item.section ? 'sidebar-section' : ''}">
                        <span th:if="${item.section}"
                              class="sidebar-section-label"
                              th:text="${item.label}">Seção</span>
                        <a th:unless="${item.section}"
                           th:href="${item.href}"
                           class="sidebar-link"
                           th:classappend="${item.active ? ' active' : ''}"
                           th:attr="target=${item.external ? '_blank' : null},rel=${item.external ? 'noopener' : null}">
                            <span class="sidebar-link-icon">
                                <i th:attr="data-lucide=${item.icon}"></i>
                            </span>
                            <span class="sidebar-link-label" th:text="${item.label}">Menu</span>
                        </a>
                    </li>
                </th:block>
            </ul>

            <div class="sidebar-footer">
                <a th:each="item : ${sidebarFooterMenus}"
                   th:href="${item.href}"
                   class="sidebar-link"
                   th:classappend="${item.active ? ' active' : ''}"
                   th:attr="target=${item.external ? '_blank' : null},rel=${item.external ? 'noopener' : null}">
                    <span class="sidebar-link-icon">
                        <i th:attr="data-lucide=${item.icon}"></i>
                    </span>
                    <span class="sidebar-link-label" th:text="${item.label}">Menu</span>
                </a>
            </div>
        </aside>

        <!-- Command Palette Floating Overlay -->
        <div id="commandPaletteModal" class="cp-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Paleta de Comandos">
            <div class="cp-window">
                <div class="cp-search-wrapper">
                    <i data-lucide="search" class="cp-search-icon"></i>
                    <input type="text" id="cpInput" class="cp-input" placeholder="Buscar páginas ou ações... (Ex: Agenda, Tema)" autocomplete="off">
                </div>
                <ul id="cpResults" class="cp-results-list">
                    <!-- Dinamicamente preenchido via JS -->
                </ul>
                <footer class="cp-footer">
                    <span>Atalho: <kbd>Ctrl</kbd> + <kbd>K</kbd></span>
                    <div class="cp-keys">
                        <span class="cp-key"><kbd>↑↓</kbd> Navegar</span>
                        <span class="cp-key"><kbd>⏎</kbd> Selecionar</span>
                        <span class="cp-key"><kbd>Esc</kbd> Fechar</span>
                    </div>
                </footer>
            </div>
        </div>
    </th:block>
</body>
</html>
