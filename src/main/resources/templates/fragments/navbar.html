<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
</head>
<body>
    <th:block th:fragment="sidebar">
        <aside class="sidebar">
            <a href="/dashboard" class="sidebar-brand">
                <div class="sidebar-brand-icon">
                    <i data-lucide="heart-pulse"></i>
                </div>
                <span class="sidebar-brand-text">FisioGestao</span>
            </a>
            <ul class="sidebar-nav">
                <li class="sidebar-nav-item">
                    <a href="/dashboard" class="sidebar-nav-link">
                        <i data-lucide="layout-dashboard"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/agenda" class="sidebar-nav-link">
                        <i data-lucide="calendar-check"></i>
                        <span>Agenda</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/calendario" class="sidebar-nav-link">
                        <i data-lucide="calendar-range"></i>
                        <span>Calendário</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/bloqueios" class="sidebar-nav-link">
                        <i data-lucide="calendar-x-2"></i>
                        <span>Bloqueios</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/solicitacoes" class="sidebar-nav-link">
                        <i data-lucide="calendar-plus"></i>
                        <span>Solicitações</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/pacotes-consumo" class="sidebar-nav-link">
                        <i data-lucide="package-open"></i>
                        <span>Pacotes de Sessões</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/pacientes" class="sidebar-nav-link">
                        <i data-lucide="id-card"></i>
                        <span>Pacientes</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/prontuario" class="sidebar-nav-link">
                        <i data-lucide="notebook-pen"></i>
                        <span>Prontuário</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/financeiro" class="sidebar-nav-link">
                        <i data-lucide="wallet"></i>
                        <span>Financeiro</span>
                    </a>
                </li>
                <li class="sidebar-nav-item">
                    <a href="/relatorios" class="sidebar-nav-link">
                        <i data-lucide="file-text"></i>
                        <span>Relatórios</span>
                    </a>
                </li>
                <li class="sidebar-nav-item" th:if="${loggedUserRole == 'ADMIN'}">
                    <a href="/configuracoes/email" class="sidebar-nav-link">
                        <i data-lucide="mail-check"></i>
                        <span>Config. E-mail</span>
                    </a>
                </li>
                <li class="sidebar-nav-item" th:if="${loggedUserRole == 'ADMIN'}">
                    <a href="/usuarios" class="sidebar-nav-link">
                        <i data-lucide="users"></i>
                        <span>Usuários</span>
                    </a>
                </li>
                <li class="sidebar-nav-item" th:if="${loggedUserRole == 'ADMIN'}">
                    <a href="/auditoria" class="sidebar-nav-link">
                        <i data-lucide="shield-check"></i>
                        <span>Auditoria</span>
                    </a>
                </li>
            </ul>
            <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="/agendamento-online" target="_blank" class="sidebar-nav-link">
                    <i data-lucide="external-link"></i>
                    <span>Agendamento Online</span>
                </a>
                <form th:action="@{/logout}" method="post" style="margin-top: 0.5rem;">
                    <button type="submit" class="sidebar-nav-link" style="width: 100%; border: none; background: transparent; cursor: pointer; text-align: left;">
                        <i data-lucide="log-out"></i>
                        <span>Sair</span>
                    </button>
                </form>
            </div>
        </aside>
    </th:block>

    <th:block th:fragment="topbar">
        <header class="topbar">
            <div class="topbar-title" th:text="${pageTitle != null ? pageTitle : 'Dashboard'}">Dashboard</div>
            <div class="topbar-user">
                <div>
                    <div class="topbar-user-name" th:text="${loggedUserDisplayName}">Usuário</div>
                    <div class="topbar-user-role">Fisioterapeuta</div>
                </div>
                <div class="topbar-user-avatar" th:text="${loggedUserInitial}">U</div>
            </div>
        </header>
    </th:block>
</body>
</html>
