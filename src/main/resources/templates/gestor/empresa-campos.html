<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="campos">
    <div class="form-field">
        <label for="nome">Nome da clínica</label>
        <input type="text" id="nome" th:field="*{nome}" maxlength="160" required>
        <small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
    </div>
    <div class="form-field">
        <label for="slug">Código (slug)</label>
        <input type="text" id="slug" th:field="*{slug}" maxlength="60" pattern="[a-z0-9]+(-[a-z0-9]+)*"
               placeholder="gerado automaticamente se vazio">
        <small class="field-help">Usado no login e nos links públicos da clínica.</small>
    </div>
    <div class="form-field">
        <label for="nomeResponsavel">Responsável</label>
        <input type="text" id="nomeResponsavel" th:field="*{nomeResponsavel}" maxlength="160">
    </div>
    <div class="form-field">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" th:field="*{cpf}" maxlength="14">
    </div>
    <div class="form-field">
        <label for="cnpj">CNPJ</label>
        <input type="text" id="cnpj" th:field="*{cnpj}" maxlength="18">
    </div>
    <div class="form-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}" maxlength="160">
    </div>
    <div class="form-field">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" th:field="*{telefone}" maxlength="20">
    </div>
</th:block>
