<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{gestor/layout :: pagina('Empresas', 'Clínicas cadastradas na plataforma, status e período de teste.', ~{::#conteudo})}">
<body>
<div id="conteudo">
    <section class="section-card">
        <form class="filter-bar" th:action="@{/gestor/empresas}" method="get">
            <input type="search" name="termo" th:value="${termo}" placeholder="Buscar por nome, código, CPF/CNPJ ou e-mail" maxlength="120">
            <select name="status">
                <option value="">Todos os status</option>
                <option th:each="s : ${statusOpcoes}" th:value="${s.name()}" th:text="${s.label}" th:selected="${statusSelecionado == s}">Status</option>
            </select>
            <button type="submit" class="action-button primary"><i data-lucide="search"></i> Filtrar</button>
            <a th:href="@{/gestor/empresas/nova}" class="action-button success"><i data-lucide="plus"></i> Nova empresa</a>
        </form>
    </section>

    <section class="section-card">
        <div class="section-body" th:if="${pagina.content.isEmpty()}">
            <div class="empty-box"><i data-lucide="building"></i><p>Nenhuma empresa encontrada.</p></div>
        </div>
        <div class="data-table-wrap" th:unless="${pagina.content.isEmpty()}">
            <table class="data-table compact">
                <thead>
                <tr><th>Clínica</th><th>Código</th><th>Responsável</th><th>Status</th><th>Teste</th><th>Criada em</th><th class="text-right">Ações</th></tr>
                </thead>
                <tbody>
                <tr th:each="e : ${pagina.content}">
                    <td>
                        <p class="entity-name" th:text="${e.nome}">Clínica</p>
                        <p class="entity-meta" th:text="${e.email != null ? e.email : '-'}">email</p>
                    </td>
                    <td><code th:text="${e.slug}">slug</code></td>
                    <td th:text="${e.nomeResponsavel != null ? e.nomeResponsavel : '-'}">Responsável</td>
                    <td><span class="chip" th:classappend="${' status-empresa-' + #strings.toLowerCase(e.status.name())}" th:text="${e.status.label}">Ativo</span></td>
                    <td>
                        <span th:if="${e.dataFimTeste != null}"
                              th:text="${e.quantidadeDiasUteisTeste} + ' d.u. — até ' + ${#temporals.format(e.dataFimTeste, 'dd/MM/yyyy')}">15 d.u.</span>
                        <span th:if="${e.dataFimTeste == null}">-</span>
                    </td>
                    <td th:text="${#temporals.format(e.createdAt, 'dd/MM/yyyy')}">01/01</td>
                    <td class="text-right">
                        <a th:href="@{/gestor/empresas/{id}(id=${e.id})}" class="action-button ghost inline-icon" aria-label="Abrir empresa"><i data-lucide="arrow-right"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav class="pagination-bar" th:if="${pagina.totalPages > 1}">
            <a th:if="${pagina.hasPrevious()}" th:href="@{/gestor/empresas(termo=${termo}, status=${statusSelecionado}, pagina=${pagina.number - 1})}" class="action-button ghost">Anterior</a>
            <span th:text="'Página ' + ${pagina.number + 1} + ' de ' + ${pagina.totalPages}">Página 1</span>
            <a th:if="${pagina.hasNext()}" th:href="@{/gestor/empresas(termo=${termo}, status=${statusSelecionado}, pagina=${pagina.number + 1})}" class="action-button ghost">Próxima</a>
        </nav>
    </section>
</div>
</body>
</html>
