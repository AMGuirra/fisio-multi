<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar cancelamento - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
    <link rel="stylesheet" th:href="@{/css/card-system.css}" href="/css/card-system.css">
</head>
<body class="pub-body" th:attr="data-theme=${loggedUserTheme.cssValue}" th:classappend="${loggedUserTheme.name() == 'DARK' ? ' theme-dark' : ''}">
    <div class="pub-container">
        <div class="pub-card">
            <div class="pub-header">
                <div class="pub-header-icon"><i data-lucide="user-x"></i></div>
                <h1>Solicitar cancelamento</h1>
                <p>Use esta página se não consegue acessar o sistema. A solicitação será analisada pela nossa equipe;
                    nenhum dado é apagado ao solicitar.</p>
            </div>

            <div th:if="${errorMessage}" class="pub-alert pub-alert-danger">
                <i data-lucide="triangle-alert"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/suporte/cancelamento}" method="post" novalidate>
                <div class="pub-form-group">
                    <label class="pub-label" for="nome">Nome do solicitante</label>
                    <input type="text" id="nome" name="nome" class="pub-control" maxlength="160" required th:value="${nome}">
                </div>
                <div class="pub-form-group">
                    <label class="pub-label" for="email">E-mail de contato</label>
                    <input type="email" id="email" name="email" class="pub-control" maxlength="160" required th:value="${email}">
                </div>
                <div class="pub-input-row">
                    <div class="pub-form-group">
                        <label class="pub-label" for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" class="pub-control" maxlength="14" th:value="${cpf}">
                    </div>
                    <div class="pub-form-group">
                        <label class="pub-label" for="cnpj">CNPJ</label>
                        <input type="text" id="cnpj" name="cnpj" class="pub-control" maxlength="18" th:value="${cnpj}">
                    </div>
                </div>
                <div class="pub-form-group">
                    <label class="pub-label" for="motivo">Motivo</label>
                    <select id="motivo" name="motivo" class="pub-select" required>
                        <option value="">Selecione</option>
                        <option th:each="m : ${motivos}" th:value="${m.name()}" th:text="${m.label}"
                                th:selected="${motivoSelecionado == m}">Motivo</option>
                    </select>
                </div>
                <div class="pub-form-group">
                    <label class="pub-label" for="descricao">Descrição <span class="pub-label-optional">(opcional, até 500 caracteres)</span></label>
                    <textarea id="descricao" name="descricao" class="pub-control" rows="4" maxlength="500" th:text="${descricao}"></textarea>
                </div>
                <div class="pub-form-group">
                    <label class="pub-label pub-check">
                        <input type="checkbox" name="confirmacao" value="true" required>
                        <span th:text="${textoConfirmacao}">Entendo que o acesso poderá ser encerrado após análise.</span>
                    </label>
                </div>
                <button type="submit" class="pub-btn-primary"><i data-lucide="send"></i> Enviar solicitação</button>
            </form>

            <div class="pub-footer-links">
                <a th:href="@{/suporte/solicitar}" class="pub-link-muted">Prefiro pedir suporte</a>
                <a th:href="@{/login}" class="pub-link-muted">Voltar ao login</a>
            </div>
        </div>
    </div>
    <script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
    <script th:attr="nonce=${cspNonce}">
        if (window.lucide && typeof window.lucide.createIcons === "function") { window.lucide.createIcons(); }
    </script>
</body>
</html>
