<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Realizado - FisioGestao</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4ee7c2;
            --primary-dark: #28c49f;
            --success: #39e5b6;
            --text-main: #ebf5ff;
            --text-soft: #a8c0d8;
            --shadow-lg: 0 24px 48px rgba(3, 8, 20, 0.58);
            --radius-xl: 1.2rem;
            --radius: 0.65rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(900px 450px at 14% -12%, rgba(78, 231, 194, 0.18), transparent 65%),
                radial-gradient(850px 420px at 100% 0%, rgba(87, 116, 255, 0.28), transparent 70%),
                linear-gradient(145deg, #040913 0%, #0b1a2c 42%, #132744 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: var(--text-main);
        }

        .container {
            max-width: 520px;
            text-align: center;
        }

        .success-card {
            background: rgba(9, 20, 36, 0.78);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: 2.6rem 1.8rem;
            border: 1px solid rgba(125, 244, 216, 0.24);
            backdrop-filter: blur(14px);
        }

        .success-icon {
            width: 82px;
            height: 82px;
            background: linear-gradient(135deg, var(--success) 0%, #34d399 100%);
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: 0 auto 1.3rem;
            font-size: 2.3rem;
            color: #fff;
            box-shadow: 0 10px 28px rgba(16, 185, 129, 0.3);
        }

        .success-title {
            font-size: 1.72rem;
            color: var(--text-main);
            margin-bottom: 0.85rem;
            font-weight: 760;
        }

        .success-text {
            color: var(--text-soft);
            margin-bottom: 1.8rem;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            padding: 0.86rem 1.35rem;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 650;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-home:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(78, 231, 194, 0.34);
            color: #fff;
        }

        .success-icon i {
            width: 34px;
            height: 34px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-card">
            <div class="success-icon">
                <i data-lucide="check"></i>
            </div>
            <h1 class="success-title">Solicitação Enviada!</h1>
            <p class="success-text">
                Sua solicitação de agendamento foi recebida com sucesso.<br>
                Em breve nossa equipe entrará em contato pelo WhatsApp
                para confirmar seu horário.
            </p>
            <a href="/agendamento-online" class="btn-home">
                <i data-lucide="arrow-left"></i>
                Fazer Novo Agendamento
            </a>
        </div>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
