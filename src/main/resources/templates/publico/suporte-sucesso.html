<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloSucesso} + ' - FisioGestao'">Solicitação enviada - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
    <link rel="stylesheet" th:href="@{/css/card-system.css}" href="/css/card-system.css">
</head>
<body class="pub-body pub-centered" th:attr="data-theme=${loggedUserTheme.cssValue}" th:classappend="${loggedUserTheme.name() == 'DARK' ? ' theme-dark' : ''}">
    <div class="pub-success-card">
        <div class="pub-success-icon"><i data-lucide="check"></i></div>
        <h1 class="pub-success-title" th:text="${tituloSucesso}">Solicitação enviada</h1>
        <p class="pub-success-text" th:text="${textoSucesso}">Recebemos sua solicitação.</p>
        <a th:href="@{/login}" href="/login" class="pub-btn-link"><i data-lucide="arrow-left"></i> Voltar ao login</a>
    </div>
    <script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
    <script th:attr="nonce=${cspNonce}">
        if (window.lucide && typeof window.lucide.createIcons === 'function') { window.lucide.createIcons(); }
    </script>
</body>
</html>
