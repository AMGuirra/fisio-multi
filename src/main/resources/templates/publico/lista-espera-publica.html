<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Espera - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
    <link rel="stylesheet" th:href="@{/css/card-system.css}" href="/css/card-system.css">
</head>
<body class="pub-body" th:attr="data-theme=${loggedUserTheme.cssValue}" th:classappend="${loggedUserTheme.name() == 'DARK' ? ' theme-dark' : ''}">
    <div class="pub-container">
        <div class="pub-card">
            <div class="pub-header">
                <div class="pub-header-icon">
                    <i data-lucide="clock"></i>
                </div>
                <h1>Lista de Espera</h1>
                <p>Deixe seu contato e avisaremos quando houver um horário disponível</p>
            </div>

            <div th:if="${errorMessage}" class="pub-alert pub-alert-danger">
                <i data-lucide="triangle-alert"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/lista-espera-publica(clinica=${clinicaSlug})}" method="post" novalidate>
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">

                <div class="pub-form-group">
                    <label class="pub-label" for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" class="pub-control"
                           placeholder="Seu nome completo" required autocomplete="name">
                </div>

                <div class="pub-form-group">
                    <label class="pub-label" for="telefone">Telefone (WhatsApp)</label>
                    <input type="tel" id="telefone" name="telefone" class="pub-control"
                           placeholder="(00) 00000-0000" required autocomplete="tel">
                </div>

                <div class="pub-form-group">
                    <label class="pub-label" for="email">E-mail <span class="pub-label-optional">(opcional)</span></label>
                    <input type="email" id="email" name="email" class="pub-control"
                           placeholder="seu@email.com" autocomplete="email">
                </div>

                <div class="pub-form-group">
                    <label class="pub-label" for="periodo">Período preferido</label>
                    <select id="periodo" name="periodo" class="pub-select">
                        <option value="QUALQUER">Qualquer horário</option>
                        <option value="MANHA">Manhã</option>
                        <option value="TARDE">Tarde</option>
                        <option value="NOITE">Noite</option>
                    </select>
                </div>

                <div class="pub-form-group">
                    <label class="pub-label" for="observacoes">Observações <span class="pub-label-optional">(opcional)</span></label>
                    <textarea id="observacoes" name="observacoes" class="pub-control" rows="3"
                              placeholder="Alguma restrição de horário ou preferência?"></textarea>
                </div>

                <button type="submit" class="pub-btn">
                    <i data-lucide="clock"></i>
                    Entrar na Lista de Espera
                </button>
            </form>

            <div class="pub-footer-links">
                <a th:href="@{/agendamento-online(clinica=${clinicaSlug})}"
                   class="pub-footer-link">
                   Agendar horário online
                </a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
    <script th:src="@{/js/br-mask.js}" src="/js/br-mask.js"></script>
    <script th:attr="nonce=${cspNonce}">
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
        const tel = document.getElementById('telefone');
        if (tel) {
            BrMask.bind(tel, BrMask.telefone);
        }
    </script>
</body>
</html>
