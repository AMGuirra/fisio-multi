<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Espera - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="pub-body pub-centered" th:attr="data-theme=${loggedUserTheme.cssValue}" th:classappend="${loggedUserTheme.name() == 'DARK' ? ' theme-dark' : ''}">
    <div class="pub-success-card">
        <div class="pub-success-icon">
            <i data-lucide="clock"></i>
        </div>
        <h1 class="pub-success-title">Você está na fila!</h1>
        <p class="pub-success-text">
            Recebemos seu contato e você foi adicionado à lista de espera.<br>
            Assim que um horário ficar disponível, nossa equipe entrará em contato pelo WhatsApp.
        </p>
        <a th:href="@{/agendamento-online}" href="/agendamento-online" class="pub-btn-link">
            <i data-lucide="calendar-plus"></i>
            Tentar agendar um horário
        </a>
    </div>

    <script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
    <script th:attr="nonce=${cspNonce}">
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
