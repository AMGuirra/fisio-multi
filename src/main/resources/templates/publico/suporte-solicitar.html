<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar suporte - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="pub-body" th:attr="data-theme=${loggedUserTheme.cssValue}" th:classappend="${loggedUserTheme.name() == 'DARK' ? ' theme-dark' : ''}">
    <div class="pub-container">
        <div class="pub-card">
            <div class="pub-header">
                <div class="pub-header-icon"><i data-lucide="life-buoy"></i></div>
                <h1>Solicitar suporte</h1>
                <p>Não consegue acessar o sistema ou precisa de ajuda? Conte o que aconteceu.</p>
            </div>

            <div th:if="${errorMessage}" class="pub-alert pub-alert-danger">
                <i data-lucide="triangle-alert"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/suporte/solicitar}" method="post" novalidate>
                <div class="pub-form-group">
                    <label class="pub-label" for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" class="pub-control" maxlength="160" required
                           th:value="${nome}" autocomplete="name">
                </div>
                <div class="pub-input-row">
                    <div class="pub-form-group">
                        <label class="pub-label" for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" class="pub-control" maxlength="14" inputmode="numeric"
                               th:value="${cpf}" placeholder="000.000.000-00">
                    </div>
                    <div class="pub-form-group">
                        <label class="pub-label" for="cnpj">CNPJ</label>
                        <input type="text" id="cnpj" name="cnpj" class="pub-control" maxlength="18" inputmode="numeric"
                               th:value="${cnpj}" placeholder="00.000.000/0000-00">
                    </div>
                </div>
                <p class="pub-help">Informe o CPF e/ou o CNPJ cadastrado na plataforma.</p>
                <div class="pub-form-group">
                    <label class="pub-label" for="email">E-mail para resposta</label>
                    <input type="email" id="email" name="email" class="pub-control" maxlength="160" required
                           th:value="${email}" autocomplete="email">
                </div>
                <div class="pub-form-group">
                    <label class="pub-label" for="descricao">Descrição
                        <span class="pub-label-optional" data-contador-descricao>(até 500 caracteres)</span></label>
                    <textarea id="descricao" name="descricao" class="pub-control" rows="5" required
                              maxlength="500" th:text="${descricao}"></textarea>
                </div>
                <button type="submit" class="pub-btn-primary"><i data-lucide="send"></i> Enviar solicitação</button>
            </form>

            <div class="pub-footer-links">
                <a th:href="@{/suporte/cancelamento}" class="pub-link-muted">Quero solicitar o cancelamento da minha clínica</a>
                <a th:href="@{/login}" class="pub-link-muted">Voltar ao login</a>
            </div>
        </div>
    </div>
    <script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
    <script th:attr="nonce=${cspNonce}">
        (function () {
            var campo = document.getElementById("descricao");
            var contador = document.querySelector("[data-contador-descricao]");
            if (!campo || !contador) return;
            var atualizar = function () { contador.textContent = "(" + campo.value.length + "/500)"; };
            campo.addEventListener("input", atualizar);
            atualizar();
        })();
        if (window.lucide && typeof window.lucide.createIcons === "function") { window.lucide.createIcons(); }
    </script>
</body>
</html>
