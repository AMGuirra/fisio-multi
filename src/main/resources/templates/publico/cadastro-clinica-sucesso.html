<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro concluído - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="pub-body pub-centered" th:attr="data-theme=${loggedUserTheme.cssValue}" th:classappend="${loggedUserTheme.name() == 'DARK' ? ' theme-dark' : ''}">
    <div class="pub-success-card">
        <div class="pub-success-icon"><i data-lucide="check"></i></div>
        <h1 class="pub-success-title">Cadastro concluído!</h1>
        <p class="pub-success-text">
            A clínica <strong th:text="${resultado.nomeClinica}">Clínica</strong> já pode usar o sistema.
            O período de teste vai até <strong th:text="${resultado.fimTeste}">01/01/2030</strong>
            (<span th:text="${resultado.diasTeste}">15</span> dias úteis).
        </p>
        <div class="pub-address-card">
            <p><strong>Como entrar:</strong></p>
            <p>Código da clínica: <strong th:text="${resultado.slug}">minha-clinica</strong></p>
            <p>Usuário: <strong th:text="${resultado.email}">voce@email.com</strong>
                (ou <span th:text="${resultado.username}">voce</span>)</p>
            <p>Senha: a que você acabou de cadastrar.</p>
        </div>
        <a th:href="@{/login(clinica=${resultado.slug})}" href="/login" class="pub-btn-link">
            <i data-lucide="log-in"></i> Entrar agora
        </a>
    </div>
    <script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
    <script th:attr="nonce=${cspNonce}">
        if (window.lucide && typeof window.lucide.createIcons === "function") { window.lucide.createIcons(); }
    </script>
</body>
</html>
