<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar clínica - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="pub-body" th:attr="data-theme=${loggedUserTheme.cssValue}" th:classappend="${loggedUserTheme.name() == 'DARK' ? ' theme-dark' : ''}">
    <div class="pub-container">
        <div class="pub-card">
            <div class="pub-header">
                <div class="pub-header-icon"><i data-lucide="building-2"></i></div>
                <h1>Comece a usar o FisioGestao</h1>
                <p>Cadastre sua clínica ou consultório e use gratuitamente por
                    <strong th:text="${diasTeste} + ' dias úteis'">15 dias úteis</strong>. O acesso é liberado na hora.</p>
            </div>

            <div th:if="${errorMessage}" class="pub-alert pub-alert-danger">
                <i data-lucide="triangle-alert"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/cadastro}" th:object="${form}" method="post" novalidate>
                <div class="pub-form-group">
                    <label class="pub-label" for="nomeClinica">Nome da clínica ou do fisioterapeuta</label>
                    <input type="text" id="nomeClinica" th:field="*{nomeClinica}" class="pub-control" maxlength="160" required>
                    <small class="pub-error" th:if="${#fields.hasErrors('nomeClinica')}" th:errors="*{nomeClinica}"></small>
                </div>
                <div class="pub-form-group">
                    <label class="pub-label" for="nomeResponsavel">Nome do responsável</label>
                    <input type="text" id="nomeResponsavel" th:field="*{nomeResponsavel}" class="pub-control" maxlength="160" required autocomplete="name">
                    <small class="pub-error" th:if="${#fields.hasErrors('nomeResponsavel')}" th:errors="*{nomeResponsavel}"></small>
                </div>
                <div class="pub-input-row">
                    <div class="pub-form-group">
                        <label class="pub-label" for="cpf">CPF</label>
                        <input type="text" id="cpf" th:field="*{cpf}" class="pub-control" maxlength="14" inputmode="numeric" placeholder="000.000.000-00">
                    </div>
                    <div class="pub-form-group">
                        <label class="pub-label" for="cnpj">CNPJ</label>
                        <input type="text" id="cnpj" th:field="*{cnpj}" class="pub-control" maxlength="18" inputmode="numeric" placeholder="00.000.000/0000-00">
                    </div>
                </div>
                <p class="pub-help">Informe o CPF e/ou o CNPJ.</p>
                <div class="pub-input-row">
                    <div class="pub-form-group">
                        <label class="pub-label" for="email">E-mail (será seu login)</label>
                        <input type="email" id="email" th:field="*{email}" class="pub-control" maxlength="160" required autocomplete="email">
                        <small class="pub-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                    </div>
                    <div class="pub-form-group">
                        <label class="pub-label" for="telefone">Telefone</label>
                        <input type="tel" id="telefone" th:field="*{telefone}" class="pub-control" maxlength="20" required autocomplete="tel" placeholder="(00) 00000-0000">
                        <small class="pub-error" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></small>
                    </div>
                </div>
                <div class="pub-input-row">
                    <div class="pub-form-group">
                        <label class="pub-label" for="senha">Senha inicial</label>
                        <input type="password" id="senha" th:field="*{senha}" class="pub-control" maxlength="72" required autocomplete="new-password">
                        <small class="pub-error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></small>
                    </div>
                    <div class="pub-form-group">
                        <label class="pub-label" for="confirmacaoSenha">Confirme a senha</label>
                        <input type="password" id="confirmacaoSenha" th:field="*{confirmacaoSenha}" class="pub-control" maxlength="72" required autocomplete="new-password">
                        <small class="pub-error" th:if="${#fields.hasErrors('confirmacaoSenha')}" th:errors="*{confirmacaoSenha}"></small>
                    </div>
                </div>
                <div class="pub-form-group">
                    <label class="pub-label" for="observacoes">Observações <span class="pub-label-optional">(opcional)</span></label>
                    <textarea id="observacoes" th:field="*{observacoes}" class="pub-control" rows="3" maxlength="500"></textarea>
                </div>
                <div class="pub-form-group">
                    <label class="pub-label pub-check">
                        <input type="checkbox" th:field="*{aceiteTermos}" required>
                        <span>Li e aceito os termos de uso e a política de privacidade.</span>
                    </label>
                    <small class="pub-error" th:if="${#fields.hasErrors('aceiteTermos')}" th:errors="*{aceiteTermos}"></small>
                </div>
                <button type="submit" class="pub-btn-primary"><i data-lucide="rocket"></i> Criar minha conta</button>
            </form>

            <div class="pub-footer-links">
                <a th:href="@{/login}" class="pub-link-muted">Já tenho conta — entrar</a>
                <a th:href="@{/suporte/solicitar}" class="pub-link-muted">Falar com o suporte</a>
            </div>
        </div>
    </div>
    <script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
    <script th:attr="nonce=${cspNonce}">
        if (window.lucide && typeof window.lucide.createIcons === "function") { window.lucide.createIcons(); }
    </script>
</body>
</html>
