<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depoimentos — Landing Page · FisioGestão</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-modern.css}">
    <link rel="stylesheet" th:href="@{/css/crud-modern.css}">
</head>
<body class="dashboard-app">
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu" aria-hidden="true"></button>
<th:block th:replace="~{fragments/app-navigation :: sidebar}"></th:block>

<div class="app-shell">
    <header class="app-header dashboard-header">
        <div class="header-left">
            <button class="header-toggle sidebar-toggle-btn" id="sidebarToggle" type="button" aria-expanded="true"><i data-lucide="panel-left"></i></button>
            <div class="header-copy">
                <h2 class="header-title">Depoimentos</h2>
                <p class="header-context">Gerencie os depoimentos exibidos na landing page.</p>
            </div>
        </div>
        <div class="header-right" style="display:flex;gap:var(--space-sm);">
            <button type="button" class="btn btn-primary" onclick="abrirModalNovo()">
                <i data-lucide="plus" style="width:15px;height:15px;"></i> Novo depoimento
            </button>
            <a th:href="@{/admin/landing}" class="btn btn-secondary"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Voltar</a>
        </div>
    </header>

    <main class="app-main" style="padding:var(--space-xl) var(--space-2xl);">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="table-cards-wrapper">
            <table class="crud-table">
                <thead>
                    <tr>
                        <th>Nome</th><th>Cargo</th><th>Estrelas</th><th>Ordem</th><th>Status</th><th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${lista}" th:classappend="${!t.ativo} ? ' row-inactive' : ''">
                        <td data-label="Nome">
                            <span th:text="${t.iniciais}" class="avatar-chip"
                                  th:style="'background:' + (${t.corAvatar==1} ? '#0c7a68' : (${t.corAvatar==2} ? '#1a52c2' : '#8e44ad')) + ';color:#fff'">XX</span>
                            <span th:text="${t.nome}">Nome</span>
                        </td>
                        <td data-label="Cargo" th:text="${t.cargo}">Cargo</td>
                        <td data-label="Estrelas">
                            <span th:each="s : ${#numbers.sequence(1,t.estrelas)}" style="color:var(--yellow-500)">★</span>
                        </td>
                        <td data-label="Ordem" th:text="${t.ordem}">0</td>
                        <td data-label="Status">
                            <span th:if="${t.ativo}" class="badge badge-success">Ativo</span>
                            <span th:unless="${t.ativo}" class="badge badge-secondary">Inativo</span>
                        </td>
                        <td data-label="Ações" style="white-space:nowrap">
                            <button type="button" class="btn btn-sm btn-secondary" title="Editar"
                                    th:onclick="'abrirModalEditar(\'' + ${t.id} + '\',\'' + ${#strings.escapeXml(t.nome)} + '\',\'' + ${#strings.escapeXml(t.cargo)} + '\',\'' + ${#strings.escapeXml(t.depoimento)} + '\',\'' + ${t.iniciais} + '\',' + ${t.corAvatar} + ',' + ${t.estrelas} + ',' + ${t.ordem} + ')'">
                                <i data-lucide="pencil" style="width:13px;height:13px;"></i>
                            </button>
                            <form th:action="@{'/admin/landing/testemunhos/' + ${t.id} + '/alternar'}" method="post" style="display:inline">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-secondary" th:title="${t.ativo ? 'Desativar' : 'Ativar'}">
                                    <i th:attr="data-lucide=${t.ativo ? 'eye-off' : 'eye'}" style="width:13px;height:13px;"></i>
                                </button>
                            </form>
                            <form th:action="@{'/admin/landing/testemunhos/' + ${t.id} + '/excluir'}" method="post" style="display:inline"
                                  onsubmit="return confirm('Remover este depoimento?')">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-danger"><i data-lucide="trash-2" style="width:13px;height:13px;"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lista)}">
                        <td colspan="6" style="text-align:center;color:var(--text-soft);padding:var(--space-xl)">Nenhum depoimento cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal Novo -->
<div id="modalNovo" class="modal-backdrop" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modalNovoTitle">
    <div class="modal-card" style="max-width:560px;width:100%">
        <div class="modal-header">
            <h3 id="modalNovoTitle" class="modal-title">Novo depoimento</h3>
            <button type="button" class="modal-close" onclick="fecharModalNovo()" aria-label="Fechar">&times;</button>
        </div>
        <form th:action="@{/admin/landing/testemunhos/novo}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <div class="modal-body">
                <div class="form-group"><label class="form-label">Nome *</label><input type="text" name="nome" class="form-control" required maxlength="160"></div>
                <div class="form-group"><label class="form-label">Cargo / Clínica</label><input type="text" name="cargo" class="form-control" maxlength="200" placeholder="Fisioterapeuta · Clínica X, Cidade - UF"></div>
                <div class="form-group"><label class="form-label">Depoimento *</label><textarea name="depoimento" class="form-control" rows="4" required maxlength="1000"></textarea></div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:var(--space-md)">
                    <div class="form-group"><label class="form-label">Iniciais *</label><input type="text" name="iniciais" class="form-control" required maxlength="4" placeholder="MP"></div>
                    <div class="form-group"><label class="form-label">Cor avatar</label>
                        <select name="corAvatar" class="form-control"><option value="1">Verde</option><option value="2">Azul</option><option value="3">Roxo</option></select>
                    </div>
                    <div class="form-group"><label class="form-label">Estrelas</label>
                        <select name="estrelas" class="form-control"><option>5</option><option>4</option><option>3</option></select>
                    </div>
                    <div class="form-group"><label class="form-label">Ordem</label><input type="number" name="ordem" class="form-control" value="0" min="0" max="99"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="fecharModalNovo()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Editar -->
<div id="modalEditar" class="modal-backdrop" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modalEditarTitle">
    <div class="modal-card" style="max-width:560px;width:100%">
        <div class="modal-header">
            <h3 id="modalEditarTitle" class="modal-title">Editar depoimento</h3>
            <button type="button" class="modal-close" onclick="fecharModalEditar()" aria-label="Fechar">&times;</button>
        </div>
        <form id="formEditar" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <div class="modal-body">
                <div class="form-group"><label class="form-label">Nome *</label><input type="text" id="editNome" name="nome" class="form-control" required maxlength="160"></div>
                <div class="form-group"><label class="form-label">Cargo / Clínica</label><input type="text" id="editCargo" name="cargo" class="form-control" maxlength="200"></div>
                <div class="form-group"><label class="form-label">Depoimento *</label><textarea id="editDepoimento" name="depoimento" class="form-control" rows="4" required maxlength="1000"></textarea></div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:var(--space-md)">
                    <div class="form-group"><label class="form-label">Iniciais *</label><input type="text" id="editIniciais" name="iniciais" class="form-control" required maxlength="4"></div>
                    <div class="form-group"><label class="form-label">Cor avatar</label>
                        <select id="editCor" name="corAvatar" class="form-control"><option value="1">Verde</option><option value="2">Azul</option><option value="3">Roxo</option></select>
                    </div>
                    <div class="form-group"><label class="form-label">Estrelas</label>
                        <select id="editEstrelas" name="estrelas" class="form-control"><option>5</option><option>4</option><option>3</option></select>
                    </div>
                    <div class="form-group"><label class="form-label">Ordem</label><input type="number" id="editOrdem" name="ordem" class="form-control" min="0" max="99"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="fecharModalEditar()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar alterações</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/vendor/lucide.min.js}"></script>
<script>
    lucide.createIcons();
    function abrirModalNovo() { document.getElementById('modalNovo').style.display='flex'; }
    function fecharModalNovo() { document.getElementById('modalNovo').style.display='none'; }
    function abrirModalEditar(id, nome, cargo, depoimento, iniciais, cor, estrelas, ordem) {
        document.getElementById('formEditar').action = '/admin/landing/testemunhos/' + id + '/editar';
        document.getElementById('editNome').value = nome;
        document.getElementById('editCargo').value = cargo;
        document.getElementById('editDepoimento').value = depoimento;
        document.getElementById('editIniciais').value = iniciais;
        document.getElementById('editCor').value = cor;
        document.getElementById('editEstrelas').value = estrelas;
        document.getElementById('editOrdem').value = ordem;
        document.getElementById('modalEditar').style.display='flex';
    }
    function fecharModalEditar() { document.getElementById('modalEditar').style.display='none'; }
    document.addEventListener('keydown', function(e){ if(e.key==='Escape'){fecharModalNovo();fecharModalEditar();} });
</script>
<script th:src="@{/js/dashboard-modern.js}" defer></script>
</body>
</html>
