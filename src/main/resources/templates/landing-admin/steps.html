<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Como Funciona — Landing Page · FisioGestão</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-modern.css}">
    <link rel="stylesheet" th:href="@{/css/crud-modern.css}">
</head>
<body class="dashboard-app">
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu" aria-hidden="true"></button>
<th:block th:replace="~{fragments/app-navigation :: sidebar}"></th:block>

<div class="app-shell">
    <header class="app-header dashboard-header">
        <div class="header-left">
            <button class="header-toggle sidebar-toggle-btn" id="sidebarToggle" type="button" aria-expanded="true"><i data-lucide="panel-left"></i></button>
            <div class="header-copy">
                <h2 class="header-title">Como Funciona</h2>
                <p class="header-context">Passos da seção "Como funciona" da landing page.</p>
            </div>
        </div>
        <div class="header-right" style="display:flex;gap:var(--space-sm);">
            <button type="button" class="btn btn-primary" onclick="abrirModalNovo()"><i data-lucide="plus" style="width:15px;height:15px;"></i> Novo passo</button>
            <a th:href="@{/admin/landing}" class="btn btn-secondary"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Voltar</a>
        </div>
    </header>

    <main class="app-main" style="padding:var(--space-xl) var(--space-2xl);">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <p class="helper-text" style="margin-bottom:var(--space-md)">
            O campo <strong>Número</strong> é o numeral exibido no círculo do passo (ex: 1, 2, 3…). A <strong>Ordem</strong> define a sequência de exibição.
        </p>

        <div class="table-cards-wrapper">
            <table class="crud-table">
                <thead><tr><th>#</th><th>Título</th><th>Ordem</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody>
                    <tr th:each="s : ${lista}" th:classappend="${!s.ativo} ? ' row-inactive' : ''">
                        <td data-label="#">
                            <span class="badge badge-success" th:text="${s.numero}">1</span>
                        </td>
                        <td data-label="Título">
                            <strong th:text="${s.titulo}">Título</strong>
                            <div style="font-size:var(--text-xs);color:var(--text-soft);margin-top:2px" th:text="${#strings.abbreviate(s.descricao, 70)}"></div>
                        </td>
                        <td data-label="Ordem" th:text="${s.ordem}">0</td>
                        <td data-label="Status">
                            <span th:if="${s.ativo}" class="badge badge-success">Ativo</span>
                            <span th:unless="${s.ativo}" class="badge badge-secondary">Inativo</span>
                        </td>
                        <td data-label="Ações" style="white-space:nowrap">
                            <button type="button" class="btn btn-sm btn-secondary"
                                    th:attr="data-id=${s.id},data-numero=${s.numero},data-titulo=${s.titulo},data-descricao=${s.descricao},data-ordem=${s.ordem}"
                                    onclick="abrirModalEditar(this)">
                                <i data-lucide="pencil" style="width:13px;height:13px;"></i>
                            </button>
                            <form th:action="@{'/admin/landing/steps/' + ${s.id} + '/alternar'}" method="post" style="display:inline">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-secondary"><i th:attr="data-lucide=${s.ativo ? 'eye-off' : 'eye'}" style="width:13px;height:13px;"></i></button>
                            </form>
                            <form th:action="@{'/admin/landing/steps/' + ${s.id} + '/excluir'}" method="post" style="display:inline"
                                  onsubmit="return confirm('Remover este passo?')">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-danger"><i data-lucide="trash-2" style="width:13px;height:13px;"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lista)}"><td colspan="5" style="text-align:center;color:var(--text-soft);padding:var(--space-xl)">Nenhum passo cadastrado.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal Novo -->
<div id="modalNovo" class="modal-backdrop" style="display:none;" role="dialog" aria-modal="true">
    <div class="modal-card" style="max-width:540px;width:100%">
        <div class="modal-header"><h3 class="modal-title">Novo passo</h3><button type="button" class="modal-close" onclick="fecharModalNovo()">&times;</button></div>
        <form th:action="@{/admin/landing/steps/novo}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <div class="modal-body">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md)">
                    <div class="form-group">
                        <label class="form-label">Número (círculo) *</label>
                        <input type="number" name="numero" class="form-control" required min="1" max="9" value="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ordem</label>
                        <input type="number" name="ordem" class="form-control" value="0" min="0" max="99">
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Título *</label>
                        <input type="text" name="titulo" class="form-control" required maxlength="120">
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Descrição *</label>
                        <textarea name="descricao" class="form-control" rows="3" required maxlength="500"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="fecharModalNovo()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Editar -->
<div id="modalEditar" class="modal-backdrop" style="display:none;" role="dialog" aria-modal="true">
    <div class="modal-card" style="max-width:540px;width:100%">
        <div class="modal-header"><h3 class="modal-title">Editar passo</h3><button type="button" class="modal-close" onclick="fecharModalEditar()">&times;</button></div>
        <form id="formEditar" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <div class="modal-body">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md)">
                    <div class="form-group">
                        <label class="form-label">Número (círculo) *</label>
                        <input type="number" id="eNumero" name="numero" class="form-control" required min="1" max="9">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ordem</label>
                        <input type="number" id="eOrdem" name="ordem" class="form-control" min="0" max="99">
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Título *</label>
                        <input type="text" id="eTitulo" name="titulo" class="form-control" required maxlength="120">
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Descrição *</label>
                        <textarea id="eDescricao" name="descricao" class="form-control" rows="3" required maxlength="500"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="fecharModalEditar()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar alterações</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/vendor/lucide.min.js}"></script>
<script>
    lucide.createIcons();
    function abrirModalNovo(){document.getElementById('modalNovo').style.display='flex';}
    function fecharModalNovo(){document.getElementById('modalNovo').style.display='none';}
    function abrirModalEditar(btn){
        var d=btn.dataset;
        document.getElementById('formEditar').action='/admin/landing/steps/'+d.id+'/editar';
        document.getElementById('eNumero').value=d.numero||1;
        document.getElementById('eTitulo').value=d.titulo||'';
        document.getElementById('eDescricao').value=d.descricao||'';
        document.getElementById('eOrdem').value=d.ordem||0;
        document.getElementById('modalEditar').style.display='flex';
    }
    function fecharModalEditar(){document.getElementById('modalEditar').style.display='none';}
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){fecharModalNovo();fecharModalEditar();}});
</script>
<script th:src="@{/js/dashboard-modern.js}" defer></script>
</body>
</html>
