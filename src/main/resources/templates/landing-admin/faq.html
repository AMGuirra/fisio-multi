<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ — Landing Page · FisioGestão</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-modern.css}">
    <link rel="stylesheet" th:href="@{/css/crud-modern.css}">
    <style>
        .lp-page-banner{background:linear-gradient(135deg,#0891b2 0%,#22d3ee 100%);border-radius:var(--radius-lg);padding:var(--space-xl) var(--space-2xl);display:flex;align-items:center;justify-content:space-between;gap:var(--space-lg);margin-bottom:var(--space-xl);flex-wrap:wrap;}
        .lp-page-banner__left{display:flex;align-items:center;gap:var(--space-md);}
        .lp-page-banner__icon{width:52px;height:52px;border-radius:var(--radius-md);background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
        .lp-page-banner__icon svg{width:24px;height:24px;}
        .lp-page-banner__title{font-size:var(--text-xl);font-weight:800;color:#fff;margin:0 0 4px;}
        .lp-page-banner__sub{font-size:var(--text-sm);color:rgba(255,255,255,.8);margin:0;}
        .lp-page-banner__btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);color:#fff;padding:10px 18px;border-radius:var(--radius-md);font-weight:600;font-size:var(--text-sm);cursor:pointer;transition:background .15s;white-space:nowrap;}
        .lp-page-banner__btn:hover{background:rgba(255,255,255,.28);}
        .lp-page-banner__btn svg{width:15px;height:15px;}
        .empty-state{text-align:center;padding:var(--space-2xl) var(--space-xl);color:var(--text-soft);}
        .empty-state svg{width:40px;height:40px;margin:0 auto var(--space-md);opacity:.4;display:block;}
        .empty-state p{margin:0;font-size:var(--text-sm);}
    </style>
</head>
<body class="dashboard-app">
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu" aria-hidden="true"></button>
<th:block th:replace="~{fragments/app-navigation :: sidebar}"></th:block>

<div class="app-shell">
    <header class="app-header dashboard-header">
        <div class="header-left">
            <button class="header-toggle sidebar-toggle-btn" id="sidebarToggle" type="button" aria-expanded="true"><i data-lucide="panel-left"></i></button>
            <div class="header-copy">
                <h2 class="header-title">FAQ</h2>
                <p class="header-context">Perguntas e respostas da landing page.</p>
            </div>
        </div>
        <div class="header-right" style="display:flex;gap:var(--space-sm);">
            <a th:href="@{/admin/landing}" class="btn btn-sm btn-secondary"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Voltar</a>
        </div>
    </header>

    <main class="app-main" style="padding:var(--space-xl) var(--space-2xl);">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <!-- Banner -->
        <div class="lp-page-banner">
            <div class="lp-page-banner__left">
                <div class="lp-page-banner__icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
                </div>
                <div>
                    <p class="lp-page-banner__title">FAQ</p>
                    <p class="lp-page-banner__sub">Perguntas frequentes exibidas com accordion interativo na landing page.</p>
                </div>
            </div>
            <button type="button" class="lp-page-banner__btn" onclick="abrirModalNovo()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
                Nova pergunta
            </button>
        </div>

        <div class="table-cards-wrapper">
            <table class="crud-table">
                <thead><tr><th>#</th><th>Pergunta</th><th>Ordem</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody>
                    <tr th:each="f,iter : ${lista}" th:classappend="${!f.ativo} ? ' row-inactive' : ''">
                        <td data-label="#" th:text="${iter.index + 1}">1</td>
                        <td data-label="Pergunta">
                            <span th:text="${f.pergunta}">Pergunta</span>
                        </td>
                        <td data-label="Ordem" th:text="${f.ordem}">0</td>
                        <td data-label="Status">
                            <span th:if="${f.ativo}" class="badge badge-success">Ativo</span>
                            <span th:unless="${f.ativo}" class="badge badge-secondary">Inativo</span>
                        </td>
                        <td data-label="Ações" style="white-space:nowrap">
                            <button type="button" class="btn btn-sm btn-secondary"
                                    th:onclick="'abrirModalEditar(\'' + ${f.id} + '\',\'' + ${#strings.escapeXml(f.pergunta)} + '\',\'' + ${#strings.escapeXml(f.resposta)} + '\',' + ${f.ordem} + ')'">
                                <i data-lucide="pencil" style="width:13px;height:13px;"></i>
                            </button>
                            <form th:action="@{'/admin/landing/faq/' + ${f.id} + '/alternar'}" method="post" style="display:inline">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-secondary"><i th:attr="data-lucide=${f.ativo ? 'eye-off' : 'eye'}" style="width:13px;height:13px;"></i></button>
                            </form>
                            <form th:action="@{'/admin/landing/faq/' + ${f.id} + '/excluir'}" method="post" style="display:inline"
                                  onsubmit="return confirm('Remover esta pergunta?')">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-danger"><i data-lucide="trash-2" style="width:13px;height:13px;"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lista)}">
                        <td colspan="5">
                            <div class="empty-state">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
                                <p>Nenhuma pergunta cadastrada.</p>
                                <p style="margin-top:6px;"><button type="button" class="btn btn-sm btn-primary" onclick="abrirModalNovo()">Adicionar primeira pergunta</button></p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal Novo -->
<div id="modalNovo" class="modal-backdrop" style="display:none;" role="dialog" aria-modal="true">
    <div class="modal-card" style="max-width:600px;width:100%">
        <div class="modal-header"><h3 class="modal-title">Nova pergunta</h3><button type="button" class="modal-close" onclick="fecharModalNovo()">&times;</button></div>
        <form th:action="@{/admin/landing/faq/novo}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <div class="modal-body">
                <div class="form-group"><label class="form-label">Pergunta *</label><input type="text" name="pergunta" class="form-control" required maxlength="500"></div>
                <div class="form-group"><label class="form-label">Resposta *</label><textarea name="resposta" class="form-control" rows="5" required maxlength="2000"></textarea></div>
                <div class="form-group"><label class="form-label">Ordem</label><input type="number" name="ordem" class="form-control" value="0" min="0" max="99"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="fecharModalNovo()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Editar -->
<div id="modalEditar" class="modal-backdrop" style="display:none;" role="dialog" aria-modal="true">
    <div class="modal-card" style="max-width:600px;width:100%">
        <div class="modal-header"><h3 class="modal-title">Editar pergunta</h3><button type="button" class="modal-close" onclick="fecharModalEditar()">&times;</button></div>
        <form id="formEditar" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <div class="modal-body">
                <div class="form-group"><label class="form-label">Pergunta *</label><input type="text" id="editPergunta" name="pergunta" class="form-control" required maxlength="500"></div>
                <div class="form-group"><label class="form-label">Resposta *</label><textarea id="editResposta" name="resposta" class="form-control" rows="5" required maxlength="2000"></textarea></div>
                <div class="form-group"><label class="form-label">Ordem</label><input type="number" id="editOrdem" name="ordem" class="form-control" min="0" max="99"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="fecharModalEditar()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar alterações</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/vendor/lucide.min.js}"></script>
<script>
    lucide.createIcons();
    function abrirModalNovo(){document.getElementById('modalNovo').style.display='flex';}
    function fecharModalNovo(){document.getElementById('modalNovo').style.display='none';}
    function abrirModalEditar(id,pergunta,resposta,ordem){
        document.getElementById('formEditar').action='/admin/landing/faq/'+id+'/editar';
        document.getElementById('editPergunta').value=pergunta;
        document.getElementById('editResposta').value=resposta;
        document.getElementById('editOrdem').value=ordem;
        document.getElementById('modalEditar').style.display='flex';
    }
    function fecharModalEditar(){document.getElementById('modalEditar').style.display='none';}
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){fecharModalNovo();fecharModalEditar();}});
</script>
<script th:src="@{/js/dashboard-modern.js}" defer></script>
</body>
</html>
