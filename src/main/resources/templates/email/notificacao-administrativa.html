<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/base :: layout(${titulo}, ~{::section})}">
<section>
    <p th:text="${mensagem}">Mensagem</p>
    <table role="presentation" cellspacing="0" cellpadding="0" style="width:100%;border-collapse:collapse;margin:16px 0;" th:if="${detalhes != null and !detalhes.isEmpty()}">
        <tr th:each="item : ${detalhes}">
            <td style="padding:8px 10px;border-bottom:1px solid #e4efec;color:#65808a;width:40%;" th:text="${item.key}">Campo</td>
            <td style="padding:8px 10px;border-bottom:1px solid #e4efec;font-weight:700;" th:text="${item.value}">Valor</td>
        </tr>
    </table>
    <p th:if="${link != null}">
        <a th:href="${link}" style="display:inline-block;background:#0f8f7a;color:#ffffff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:700;">Abrir no Gestor</a>
    </p>
</section>
</body>
</html>
