<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (titulo, conteudo)">
<body style="margin:0;padding:0;background:#eef5f3;font-family:Arial,Helvetica,sans-serif;color:#18323a;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;"
     th:text="${preheader != null ? preheader : titulo}">
    Atualização da clínica.
</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef5f3;padding:28px 0;">
    <tr>
        <td align="center" style="padding:0 14px;">
            <table role="presentation" width="640" cellspacing="0" cellpadding="0" style="max-width:640px;width:100%;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #d9e7e3;box-shadow:0 18px 44px rgba(24,50,58,.10);">
                <tr>
                    <td style="padding:30px 32px;background:#0f8f7a;color:#ffffff;">
                        <div style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.82;font-weight:700;"
                             th:text="${nomeClinica != null ? nomeClinica : 'FisioGestao'}">FisioGestao</div>
                        <h1 style="margin:12px 0 0;font-size:27px;line-height:1.22;font-weight:800;" th:text="${titulo}">Título</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;line-height:1.65;font-size:16px;">
                        <div th:replace="${conteudo}">Conteúdo</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:22px 32px;background:#f7fbfa;color:#65808a;font-size:13px;border-top:1px solid #e4efec;line-height:1.55;">
                        <strong style="color:#18323a;">Mensagem automática</strong><br>
                        Este e-mail foi enviado pelo FisioGestao para manter você informado sobre seu atendimento.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
