<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/base :: layout(${titulo}, ~{::section})}">
<section>
    <p>Olá, <strong th:text="${nomeDestinatario}">Paciente</strong>.</p>
    <p th:text="${mensagem}">Mensagem</p>
    <p><strong>Tipo:</strong> <span th:text="${tipoLembrete}">AGENDAMENTO</span></p>
    <p th:if="${dataReferencia != null}"><strong>Data:</strong> <span th:text="${dataReferencia}">01/01/2026</span></p>
    <p th:if="${horaReferencia != null}"><strong>Hora:</strong> <span th:text="${horaReferencia}">10:00</span></p>
</section>
</body>
</html>
