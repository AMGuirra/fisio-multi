<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/base :: layout('Agendamento cancelado', ~{::section})}">
<section>
    <p>Olá, <strong th:text="${nomePaciente}">Paciente</strong>.</p>
    <p>Seu agendamento foi cancelado pela clínica. Caso queira reagendar, entre em contato conosco.</p>
    <p><strong>Horário cancelado:</strong> <span th:text="${dataHora}">01/01/2026 10:00</span></p>
    <p><strong>Unidade/local:</strong> <span th:text="${local}">Clínica</span></p>
    <p><strong>Observações:</strong> <span th:text="${observacoes}">Sem observações.</span></p>
</section>
</body>
</html>
