<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/base :: layout('Recuperação de senha', ~{::section})}">
<section>
    <p>Olá, <strong th:text="${nomeUsuario}">usuario</strong>.</p>
    <p>Recebemos uma solicitação para redefinir a senha da sua conta.</p>
    <p><a th:href="${linkRedefinicao}" style="display:inline-block;padding:14px 20px;border-radius:12px;background:#0f8f7a;color:#ffffff;text-decoration:none;font-weight:700;">Redefinir senha</a></p>
    <p>Se preferir, copie este link no navegador:</p>
    <p><a th:href="${linkRedefinicao}" th:text="${linkRedefinicao}">link</a></p>
    <p>Se você não solicitou essa ação, ignore esta mensagem.</p>
</section>
</body>
</html>
