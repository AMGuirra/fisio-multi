<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/base :: layout('Seu acesso ao FisioGestao', ~{::section})}">
<section>
    <p>Olá, <strong th:text="${nomeUsuario}">usuario</strong>.</p>
    <p>Seu acesso ao sistema foi criado com sucesso.</p>
    <ul>
        <li><strong>Login:</strong> <span th:text="${email}">email</span></li>
        <li><strong>Portal:</strong> <a th:href="${baseUrl}" th:text="${baseUrl}">acesso</a></li>
    </ul>
    <p>Para definir sua senha com segurança, use o botão abaixo:</p>
    <p><a th:href="${linkRedefinicao}" style="display:inline-block;padding:14px 20px;border-radius:12px;background:#0f8f7a;color:#ffffff;text-decoration:none;font-weight:700;">Definir minha senha</a></p>
</section>
</body>
</html>
