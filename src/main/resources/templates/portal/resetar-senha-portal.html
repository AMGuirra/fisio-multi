<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - FisioGestao</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
    <link rel="stylesheet" th:href="@{/css/card-system.css}" href="/css/card-system.css">
</head>
<body class="pub-body pub-centered" th:attr="data-theme=${loggedUserTheme.cssValue}" th:classappend="${loggedUserTheme.name() == 'DARK' ? ' theme-dark' : ''}">
    <div class="pub-success-card pub-success-card--compact">
        <div class="pub-header-icon pub-header-icon--centered">
            <i data-lucide="lock-keyhole"></i>
        </div>

        <!-- Senha redefinida com sucesso -->
        <div th:if="${successMessage}">
            <h1 class="pub-success-title pub-success-title--compact">Senha redefinida!</h1>
            <div class="pub-alert pub-alert-success pub-alert--balanced">
                <i data-lucide="circle-check"></i>
                <span th:text="${successMessage}"></span>
            </div>
        </div>

        <!-- Token inválido ou expirado -->
        <div th:if="${!tokenValido and successMessage == null}">
            <h1 class="pub-success-title pub-success-title--compact">Link inválido</h1>
            <div class="pub-alert pub-alert-danger pub-alert--balanced">
                <i data-lucide="triangle-alert"></i>
                <span>Este link de redefinição é inválido ou já expirou. Solicite um novo link.</span>
            </div>
        </div>

        <!-- Token válido — formulário de nova senha -->
        <div th:if="${tokenValido and successMessage == null}">
            <h1 class="pub-success-title pub-success-title--compact">Redefinir senha</h1>
            <p class="pub-success-text pub-text-tight">
                Escolha uma nova senha para acessar o portal.
            </p>

            <div th:if="${errorMessage}" class="pub-alert pub-alert-danger pub-alert--spaced">
                <i data-lucide="triangle-alert"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/paciente/resetar-senha}" method="post" class="pub-form-panel">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <input type="hidden" name="token" th:value="${resetToken}">

                <div class="pub-form-group">
                    <label class="pub-label" for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" name="novaSenha" class="pub-control"
                           placeholder="Mínimo 8 caracteres" autofocus autocomplete="new-password" required minlength="8">
                </div>

                <div class="pub-form-group pub-form-group--spaced">
                    <label class="pub-label" for="confirmacaoSenha">Confirmar nova senha</label>
                    <input type="password" id="confirmacaoSenha" name="confirmacaoSenha" class="pub-control"
                           placeholder="Repita a nova senha" autocomplete="new-password" required minlength="8">
                </div>

                <button type="submit" class="pub-btn-primary pub-action-offset">
                    <i data-lucide="check"></i>
                    Salvar nova senha
                </button>
            </form>
        </div>
    </div>

    <script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
    <script th:attr="nonce=${cspNonce}">
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
