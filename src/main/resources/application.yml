spring:
  application:
    name: FisioGestao
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fisio}?sslmode=${DB_SSLMODE:disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: com.fisiogestao.config.PostgreSqlCompatibleDialect
        jdbc:
          "[time_zone]": ${app.timezone}
        timezone:
          "[default_storage]": NORMALIZE
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    table: flyway_schema_history_fisiogestao
    baseline-on-migrate: true
    baseline-version: 0
  thymeleaf:
    # cache: true em produção; DevTools desativa automaticamente em dev (dependência com optional:true)
    cache: true
  mvc:
    format:
      date: dd/MM/yyyy
      time: HH:mm
      date-time: dd/MM/yyyy HH:mm
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB      # limite por arquivo — validado também no ProntuarioAnexoService
      max-request-size: 20MB   # limite por requisição (arquivo + metadados)
  jackson:
    time-zone: ${app.timezone}

server:
  port: ${PORT:${SERVER_PORT:8081}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  packages-to-scan: com.fisiogestao

app:
  timezone: America/Campo_Grande
  base-url: ${APP_BASE_URL:http://localhost:8081}
  flyway:
    repair-on-startup: ${APP_FLYWAY_REPAIR_ON_STARTUP:false}
  security:
    encryption-key: ${APP_ENCRYPTION_KEY:}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    nome: ${APP_BOOTSTRAP_ADMIN_NOME:Administrador}
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
