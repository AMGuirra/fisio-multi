spring:
  application:
    name: FisioGestao
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fisioterapia}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: America/Campo_Grande
    show-sql: false
  flyway:
    enabled: false
  thymeleaf:
    cache: false
  mvc:
    format:
      date: dd/MM/yyyy
      time: HH:mm
      date-time: dd/MM/yyyy HH:mm
  jackson:
    time-zone: America/Campo_Grande

server:
  port: ${SERVER_PORT:8083}

app:
  timezone: America/Campo_Grande
