spring:
  application:
    name: FisioGestao
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fisio}?sslmode=${DB_SSLMODE:disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: com.fisiogestao.config.PostgreSqlCompatibleDialect
        jdbc:
          "[time_zone]": America/Campo_Grande
        timezone:
          "[default_storage]": NORMALIZE
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    table: flyway_schema_history_fisiogestao
    baseline-on-migrate: true
    baseline-version: 0
  thymeleaf:
    cache: false
  mvc:
    format:
      date: dd/MM/yyyy
      time: HH:mm
      date-time: dd/MM/yyyy HH:mm
  jackson:
    time-zone: America/Campo_Grande

server:
  port: ${PORT:${SERVER_PORT:8081}}

app:
  timezone: America/Campo_Grande
  base-url: ${APP_BASE_URL:http://localhost:8081}
  flyway:
    repair-on-startup: ${APP_FLYWAY_REPAIR_ON_STARTUP:false}
  security:
    encryption-key: ${APP_ENCRYPTION_KEY:}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    nome: ${APP_BOOTSTRAP_ADMIN_NOME:Administrador}
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  whatsapp:
    # Defina enabled=true e url-envio para ativar o envio real.
    # Em modo desativado as mensagens são apenas registradas no log.
    enabled: ${APP_WHATSAPP_ENABLED:false}
    # Endpoint de envio da sua API (Evolution API, Z-API, etc.)
    url-envio: ${APP_WHATSAPP_URL_ENVIO:}
    # Nome do campo JSON para o número de destino
    campo-numero: ${APP_WHATSAPP_CAMPO_NUMERO:number}
    # Nome do campo JSON para o texto da mensagem
    campo-mensagem: ${APP_WHATSAPP_CAMPO_MENSAGEM:text}
    # Token/API key enviado como Bearer no header Authorization
    token: ${APP_WHATSAPP_TOKEN:}
    # Máximo de tentativas antes de marcar a mensagem como ERRO
    max-tentativas: ${APP_WHATSAPP_MAX_TENTATIVAS:3}
    # Intervalo entre ciclos do processador da fila (em milissegundos)
    intervalo-ms: ${APP_WHATSAPP_INTERVALO_MS:30000}
