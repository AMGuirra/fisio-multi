<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:with="csrfParameterName=${_csrf.parameterName}, csrfToken=${_csrf.token}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Landing Page · FisioGestão</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-brand-icon">
                <i data-lucide="layout-panel-top"></i>
            </div>
            <h1 class="auth-brand-title">Landing Page</h1>
            <p class="auth-brand-subtitle">Painel de administração do conteúdo institucional</p>
        </div>

        <div th:if="${param.error}" class="auth-alert danger">
            <i data-lucide="triangle-alert"></i>
            Usuário ou senha inválidos
        </div>

        <div th:if="${param.logout}" class="auth-alert success">
            <i data-lucide="circle-check"></i>
            Você foi desconectado com sucesso
        </div>

        <form action="/login" method="post">
            <input type="hidden" th:name="${csrfParameterName}" th:value="${csrfToken}">

            <div class="auth-field">
                <label for="username">
                    <i data-lucide="user-round"></i>
                    Usuário
                </label>
                <input type="text" id="username" name="username"
                       placeholder="admin" autocomplete="username" required autofocus>
            </div>

            <div class="auth-field">
                <label for="password">
                    <i data-lucide="lock"></i>
                    Senha
                </label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="auth-btn">
                <i data-lucide="log-in"></i>
                Entrar
            </button>
        </form>

        <div class="auth-back">
            <a th:href="@{/}">
                <i data-lucide="arrow-left"></i>
                Voltar para a página inicial
            </a>
        </div>
    </div>
    <script th:src="@{/js/vendor/lucide.min.js}" src="/js/vendor/lucide.min.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
