spring:
  application:
    name: LandingPage
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:landing}?sslmode=${DB_SSLMODE:disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: com.fisiogestao.config.PostgreSqlCompatibleDialect
        jdbc:
          "[time_zone]": ${app.timezone}
        timezone:
          "[default_storage]": NORMALIZE
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    table: flyway_schema_history_landing
    baseline-on-migrate: true
    baseline-version: 0
  thymeleaf:
    cache: true

server:
  port: ${PORT:${SERVER_PORT:8082}}

app:
  timezone: America/Campo_Grande
  admin:
    username: ${LANDING_ADMIN_USERNAME:admin}
    password: ${LANDING_ADMIN_PASSWORD:admin}
